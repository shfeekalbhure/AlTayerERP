name: Phase1 baseline generation

on:
  push:
    branches:
      - agent/phase1-clean-database-implementation
    paths:
      - 'Tools/Phase1Baseline/**'
      - 'AlTayerERP.Core/**'
      - 'AlTayerERP.Infrastructure/**'
      - 'AlTayerERP.API/**'
      - '.github/workflows/phase1-baseline-generation.yml'

permissions:
  contents: write

jobs:
  generate-baseline:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase1-clean-database-implementation
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.12

      - name: Prepare EF model without database access
        run: python3 Tools/Phase1Baseline/prepare_phase1_baseline.py

      - name: Restore API and Infrastructure
        run: |
          dotnet restore AlTayerERP.Infrastructure/AlTayerERP.Infrastructure.csproj
          dotnet restore AlTayerERP.API/AlTayerERP.API.csproj

      - name: Build model before migration
        run: |
          dotnet build AlTayerERP.Infrastructure/AlTayerERP.Infrastructure.csproj -c Release --no-restore
          dotnet build AlTayerERP.API/AlTayerERP.API.csproj -c Release --no-restore

      - name: Generate clean baseline migration
        run: |
          rm -rf AlTayerERP.Infrastructure/Migrations
          dotnet ef migrations add Baseline_Phase1 \
            --context AppDbContext \
            --project AlTayerERP.Infrastructure/AlTayerERP.Infrastructure.csproj \
            --startup-project AlTayerERP.API/AlTayerERP.API.csproj \
            --output-dir Migrations

      - name: Generate review SQL only
        run: |
          mkdir -p Database/Baseline
          dotnet ef migrations script 0 Baseline_Phase1 \
            --context AppDbContext \
            --project AlTayerERP.Infrastructure/AlTayerERP.Infrastructure.csproj \
            --startup-project AlTayerERP.API/AlTayerERP.API.csproj \
            --output Database/Baseline/Baseline_Phase1.sql

      - name: Validate generated migration and SQL
        shell: bash
        run: |
          set -euo pipefail
          FILES="AlTayerERP.Infrastructure/Migrations Database/Baseline/Baseline_Phase1.sql"
          if grep -RniE 'altayer_erp_db|DROP[[:space:]]+DATABASE|USE[[:space:]]+[`]?altayer|Password[[:space:]]*=' $FILES; then
            echo 'تم العثور على نص محظور داخل Baseline.'
            exit 1
          fi
          if grep -RniE 'INSERT INTO (companies|tenant_branches|users|financial_voucher_headers|journal_entry_headers|cash_boxes|bank_accounts)' Database/Baseline/Baseline_Phase1.sql; then
            echo 'تم العثور على بيانات تشغيلية أو تجريبية محظورة.'
            exit 1
          fi
          test -s Database/Baseline/Baseline_Phase1.sql

      - name: Count baseline objects
        shell: bash
        run: |
          TABLES=$(grep -Eic '^CREATE TABLE' Database/Baseline/Baseline_Phase1.sql || true)
          FKS=$(grep -Eic 'FOREIGN KEY' Database/Baseline/Baseline_Phase1.sql || true)
          INDEXES=$(grep -Eic '^CREATE( UNIQUE)? INDEX' Database/Baseline/Baseline_Phase1.sql || true)
          UNIQUE=$(grep -Eic 'UNIQUE' Database/Baseline/Baseline_Phase1.sql || true)
          CHECKS=$(grep -Eic 'CHECK ' Database/Baseline/Baseline_Phase1.sql || true)
          cat > Database/Reviews/Phase2_Baseline_PreApply_Report.md <<EOF
          # تقرير Baseline المرحلة الأولى قبل التطبيق

          - فرع التنفيذ: \`agent/phase1-clean-database-implementation\`
          - SHA نقطة البداية: \`1ddbbfcb65588fa8d6e8ebb235d655e88013cdbf\`
          - اسم Migration: \`Baseline_Phase1\`
          - Character Set: \`utf8mb4\`
          - Collation: \`utf8mb4_unicode_ci\`
          - عدد CREATE TABLE في السكربت: **$TABLES**
          - عدد مراجع FOREIGN KEY: **$FKS**
          - عدد أوامر إنشاء الفهارس: **$INDEXES**
          - عدد مرات UNIQUE في السكربت: **$UNIQUE**
          - عدد CHECK Constraints: **$CHECKS**
          - سكربت المراجعة: \`Database/Baseline/Baseline_Phase1.sql\`

          ## التحقق الأمني

          - لا يوجد اسم \`altayer_erp_db\`.
          - لا يوجد \`DROP DATABASE\`.
          - لا يوجد \`USE\` لقاعدة ثابتة.
          - لا توجد كلمات مرور تشغيلية.
          - لا توجد شركة أو فرع أو مستخدم أو بيانات مالية تجريبية.
          - لم يُنفذ \`Update-Database\` ولم يُنشأ اتصال MySQL.

          ## Runtime DDL

          تم تعطيل DDL داخل \`PaymentRequestSchemaInitializer\`. بقيت Seeders للبيانات المرجعية فقط.
          EOF

      - name: Build API Desktop and Mobile Android
        run: |
          dotnet restore AlTayerERP.Desktop/AlTayerERP.Desktop.csproj
          dotnet build AlTayerERP.Desktop/AlTayerERP.Desktop.csproj -c Release --no-restore
          dotnet workload install maui-android
          dotnet restore AlTayerERP.Mobile.Office/AlTayerERP.Mobile.Office.csproj -p:TargetFramework=net10.0-android
          dotnet build AlTayerERP.Mobile.Office/AlTayerERP.Mobile.Office.csproj -c Release -f net10.0-android --no-restore

      - name: Commit generated baseline
        shell: bash
        run: |
          git config user.name 'openai-codex-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AlTayerERP.Core AlTayerERP.Infrastructure AlTayerERP.API Database Tools
          if git diff --cached --quiet; then
            echo 'لا توجد تغييرات جديدة.'
            exit 0
          fi
          git commit -m 'feat(database): توليد Baseline_Phase1 النظيفة [baseline-generated]'
          git push origin HEAD:agent/phase1-clean-database-implementation
