name: Build verification

on:
  push:
    branches:
      - agent/unified-phase1-screens
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build API and Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Capture API build errors
        shell: pwsh
        run: |
          $output = dotnet build AlTayerERP.API/AlTayerERP.API.csproj --configuration Release 2>&1
          $output | Out-File api-build.log -Encoding utf8
          $errors = $output | Select-String -Pattern ': error '
          if ($errors) { $errors | Out-File api-errors.txt -Encoding utf8 } else { 'NO_API_ERRORS' | Out-File api-errors.txt -Encoding utf8 }
          exit 0

      - name: Upload API diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: api-build-diagnostics
          path: |
            api-errors.txt
            api-build.log
