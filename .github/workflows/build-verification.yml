name: Build verification

on:
  push:
    branches:
      - agent/unified-phase1-screens
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build API and Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and capture diagnostics
        shell: pwsh
        run: |
          $output = dotnet build AlTayerERP.Desktop/AlTayerERP.Desktop.csproj --configuration Release 2>&1
          $output | Out-File -FilePath desktop-build.log -Encoding utf8
          $errors = $output | Select-String -Pattern ': error '
          if ($errors) { $errors | Out-File -FilePath desktop-errors.txt -Encoding utf8 } else { 'NO_DESKTOP_ERRORS' | Out-File desktop-errors.txt -Encoding utf8 }
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-diagnostics
          path: |
            desktop-errors.txt
            desktop-build.log
